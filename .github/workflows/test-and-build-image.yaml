name: test-and-build-image

on:
  pull_request:
    paths: ["temurin/**", "scripts/**"]
  workflow_dispatch:

env:
  IMAGE_BASE: ghcr.io/esempe-id/eclipse-temurin

jobs:
  lint:
    name: Check generated Dockerfiles
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Drift check
        run: python3 scripts/generate_dockerfiles.py --check

  build:
    name: Build temurin-${{ matrix.version }}
    needs: lint
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        version: [8, 17, 21, 25]
    steps:
      - uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build (no push)
        uses: docker/build-push-action@v7
        with:
          context: ./temurin/${{ matrix.version }}
          file: ./temurin/${{ matrix.version }}/Dockerfile
          push: false
          tags: ${{ env.IMAGE_BASE }}:${{ matrix.version }}-jre
          cache-from: type=gha,scope=temurin-${{ matrix.version }}
          cache-to: type=gha,mode=max,scope=temurin-${{ matrix.version }}