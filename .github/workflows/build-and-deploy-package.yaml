name: build-and-deploy-package

on:
  push:
    branches: [main]
    paths: ["temurin/**", "scripts/**"]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_BASE: ghcr.io/esempe-id/eclipse-temurin

jobs:
  lint:
    name: Check generated Dockerfiles
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Drift check
        run: python3 scripts/generate_dockerfiles.py --check

  build-and-push:
    name: Publish temurin-${{ matrix.version }}-jre
    needs: lint
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        version: [8, 17, 21, 25]
    steps:
      - uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Ensure GHCR package is public
        run: |
          gh api -X PATCH "orgs/esempe-id/packages/container/eclipse-temurin" \
            --field visibility=public

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: ./temurin/${{ matrix.version }}
          file: ./temurin/${{ matrix.version }}/Dockerfile
          push: true
          tags: ${{ env.IMAGE_BASE }}:${{ matrix.version }}-jre
          cache-from: type=gha,scope=temurin-${{ matrix.version }}
          cache-to: type=gha,mode=max,scope=temurin-${{ matrix.version }}